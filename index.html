<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>媒体解码器</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
    font-family:Inter,"Segoe UI",Arial,sans-serif;color:#eef2ff;
    background:linear-gradient(160deg,#070b16,#0d1424 60%,#070b16);
    padding:18px 14px;
  }
  .app{width:min(720px,100%);background:rgba(11,16,32,.94);border:1px solid rgba(255,255,255,.08);
    box-shadow:0 22px 60px rgba(0,0,0,.36);border-radius:20px;overflow:hidden}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.3px}
  .logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#28c5ff);display:grid;place-items:center;box-shadow:0 10px 30px rgba(76,110,245,.35)}
  .dot{width:8px;height:8px;border-radius:50%;background:#52e6a7;box-shadow:0 0 16px #52e6a7}
  .main{padding:20px}
  .hero h1{font-size:clamp(24px,7vw,34px);margin:0 0 6px}.hero p{margin:0;color:#9aa6c2;line-height:1.5;font-size:14px}
  .panel{margin-top:18px;padding:16px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
  label{display:block;font-size:14px;color:#b8c1d9;margin-bottom:10px}
  textarea{width:100%;min-height:125px;resize:vertical;border:1px solid rgba(255,255,255,.1);outline:none;border-radius:14px;background:#080d1a;color:#dce5ff;padding:14px;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;transition:.2s}
  textarea:focus{border-color:#6d6cff;box-shadow:0 0 0 4px rgba(109,108,255,.12)}
  .actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:8px}
  .primary{color:white;background:linear-gradient(135deg,#735cff,#2bbcff);box-shadow:0 12px 28px rgba(66,103,255,.25)}
  .primary:hover{transform:translateY(-1px)}
  .primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .ghost{background:rgba(255,255,255,.07);color:#cfd6e8}
  .status{margin-left:auto;color:#8e9bb8;font-size:13px}
  .progressWrap{display:none;margin-top:18px}
  .progressHead{display:flex;justify-content:space-between;color:#9eabc7;font-size:13px;margin-bottom:8px}
  .track{height:10px;background:#090e19;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#715dff,#30d8ff);border-radius:999px;transition:width .25s ease}
  .log{display:none!important}
  .mediaCard{display:none;margin-top:18px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#050912;box-shadow:0 18px 40px rgba(0,0,0,.28)}
  .mediaHeader{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(255,255,255,.04)}
  .ready{color:#6ef0ad;font-size:13px;font-weight:700}
  .player{position:relative;aspect-ratio:16/9;background:#03060d;cursor:pointer}
  video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(to top,rgba(0,0,0,.42),rgba(0,0,0,.05));transition:.2s}
  .playBtn{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);font-size:28px;box-shadow:0 10px 35px rgba(0,0,0,.35)}
  .hint{text-align:center;color:#77839d;font-size:11px;margin-top:12px}
  .browserTip{margin-top:14px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:#9eabc7;font-size:12px;text-align:center}
  .browserTip b{color:#eef2ff}
  .contact{margin-top:18px;padding:14px 10px 2px;border-top:1px solid rgba(255,255,255,.07);text-align:center;font-size:13px;color:#8e9bb8}
  .contact b{color:#fff;font-size:14px}
  @media(max-width:640px){
    body{padding:10px}
    .app{border-radius:16px}
    .main{padding:16px}
    .logo{width:32px;height:32px;border-radius:10px}
    .brand{font-size:14px}
    .topbar>div:last-child{font-size:12px!important}
    .actions{display:grid;grid-template-columns:1fr 1fr}
    button{justify-content:center;width:100%}
    .status{grid-column:1/-1;width:100%;margin:0;text-align:center}
    .mediaHeader{padding:12px 13px}
    .playBtn{width:66px;height:66px;font-size:24px}
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><div class="logo">▶</div> MEDIA DECODER</div>
      <div style="display:flex;align-items:center;gap:8px;color:#8d98b0;font-size:13px"><span class="dot"></span> Ready</div>
    </div>

    <div class="main">
      <div class="hero">
        <h1>媒体内容解码器</h1>
        <p>粘贴内容，点击解码，完成后即可播放媒体。</p>
      </div>

      <div class="panel">
        <label for="payload">待解码内容</label>
        <textarea id="payload" placeholder="请在这里粘贴需要解码的内容……"></textarea>

        <div class="actions">
          <button class="primary" id="decodeBtn">⚡ 开始解码</button>
          <button class="ghost" id="clearBtn">清空</button>
          <div class="status" id="statusText">等待输入</div>
        </div>

        <div class="progressWrap" id="progressWrap">
          <div class="progressHead"><span id="stepText">初始化解析器…</span><span id="percentText">0%</span></div>
          <div class="track"><div class="bar" id="bar"></div></div>
          <div class="log" id="log"></div>
        </div>
      </div>

      <div class="mediaCard" id="mediaCard">
        <div class="mediaHeader">
          <div><strong>已解码媒体</strong><div style="font-size:12px;color:#8190ac;margin-top:4px">video/mp4 · 1920×1080</div></div>
          <div class="ready">● DECODED</div>
        </div>
        <div class="player" id="player">
          <video id="video" preload="metadata" playsinline controls>
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
          </video>
          <div class="overlay" id="overlay"><div><div class="playBtn">▶</div><div style="text-align:center;margin-top:12px;font-size:13px">点击播放媒体</div></div></div>
        </div>
      </div>

      <div class="browserTip">为获得更稳定的播放体验，推荐使用 <b>Safari 默认浏览器</b> 打开</div>
      <div class="hint">演示页面 · 解码过程为视觉模拟</div>
      <div class="contact">联系方式&nbsp; <b>@XUU222</b></div>
    </div>
  </div>

<script>
const payload = document.getElementById('payload');
const decodeBtn = document.getElementById('decodeBtn');
const clearBtn = document.getElementById('clearBtn');
const statusText = document.getElementById('statusText');
const progressWrap = document.getElementById('progressWrap');
const bar = document.getElementById('bar');
const percentText = document.getElementById('percentText');
const stepText = document.getElementById('stepText');
const mediaCard = document.getElementById('mediaCard');
const player = document.getElementById('player');
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');

let attempt = 0;
let timer = null;

function resetTimer(){
  if (timer) clearInterval(timer);
  timer = null;
}

function startDecode(){
  if (!payload.value.trim()) {
    payload.focus();
    statusText.textContent = '请输入解码内容';
    stepText.textContent = '等待输入内容';
    return;
  }

  resetTimer();
  attempt += 1;
  decodeBtn.disabled = true;
  clearBtn.disabled = true;
  mediaCard.style.display = 'none';
  progressWrap.style.display = 'block';
  bar.style.width = '0%';
  percentText.textContent = '0%';
  statusText.textContent = '解码中…';

  let seconds = 0;
  stepText.textContent = '正在解码 · 0 秒';

  timer = setInterval(() => {
    seconds += 1;
    const pct = Math.min(96, Math.round((seconds / 15) * 96));
    bar.style.width = pct + '%';
    percentText.textContent = pct + '%';
    stepText.textContent = '正在解码 · ' + seconds + ' 秒';

    if (seconds >= 15) {
      resetTimer();
      decodeBtn.disabled = false;
      clearBtn.disabled = false;

      if (attempt === 1) {
        bar.style.width = '100%';
        percentText.textContent = '100%';
        stepText.textContent = '解码失败，请重新尝试';
        statusText.textContent = '解码失败';
        decodeBtn.textContent = '↻ 重新尝试解码';
      } else {
        bar.style.width = '100%';
        percentText.textContent = '100%';
        stepText.textContent = '解码完成';
        statusText.textContent = '完成';
        decodeBtn.textContent = '⚡ 再次解码';
        mediaCard.style.display = 'block';
        mediaCard.scrollIntoView({behavior:'smooth', block:'nearest'});
      }
    }
  }, 1000);
}

decodeBtn.addEventListener('click', startDecode);

clearBtn.addEventListener('click', () => {
  resetTimer();
  attempt = 0;
  payload.value = '';
  progressWrap.style.display = 'none';
  mediaCard.style.display = 'none';
  statusText.textContent = '等待输入';
  stepText.textContent = '初始化解析器…';
  bar.style.width = '0%';
  percentText.textContent = '0%';
  decodeBtn.textContent = '⚡ 开始解码';
  decodeBtn.disabled = false;
  clearBtn.disabled = false;
  video.pause();
  video.currentTime = 0;
  overlay.style.display = 'grid';
});

player.addEventListener('click', (e) => {
  if (e.target === video && !video.paused) return;
  if (video.paused) video.play(); else video.pause();
});
video.addEventListener('play', () => overlay.style.display = 'none');
video.addEventListener('pause', () => { if (!video.ended) overlay.style.display = 'grid'; });
video.addEventListener('ended', () => overlay.style.display = 'grid');
</script>
</body>
</html>
